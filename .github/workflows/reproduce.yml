# Rebuild the shipped 8188fu.ko from this tree and assert its SHA-256.
#
# This repository's whole claim is one hash. This workflow is that claim,
# executed: it exports a clean `git archive` of the commit under test, builds it
# with the reconstructed toolchain against the vendor kernel at the vendor's own
# absolute path, and fails unless the result is
#
#     a7fcfe277c77d9e497104fd5cc12f62ccd3df851b0ff3292b035444f5d78bb13
#
# It builds twice and requires the two outputs to be byte-identical, so a
# passing run also says the build is deterministic.
#
# It redistributes none of the vendor's material. The shipped module is never
# fetched or stored; a hash is not a binary. Everything this job downloads is
# public: the FSF's GCC 6.5.0 release, kernel.org's crosstool prebuilt,
# Debian packages from a pinned snapshot, and OpenIPC/linux at one commit.
#
# HOST ARCHITECTURE, AND WHY THAT IS THE INTERESTING PART.
# Local development for this project is arm64; these runners are x86_64. GCC
# 6.5.0 is built from source in both cases and is a *cross* compiler either way,
# so the host architecture should not reach target code generation - the host
# only decides which machine runs cc1, not what cc1 emits. That is the standard
# argument and it is almost certainly right. It is also exactly the kind of
# assumption this project exists to check rather than repeat, so the check is
# the hash below and nothing weaker.
#
# If this job ever fails on x86_64 with a mismatch that does not reproduce on
# arm64, that is not a CI problem to paper over by pinning the runner. It is a
# finding about GCC 6.5.0 - a host-dependent code-generation path - and it is
# worth investigating before anything here is changed.
#
# ONE RECIPE, NOT TWO.
# Every step below runs a build/*.sh script that the local Docker flow runs too
# (README §5.2); the workflow supplies paths and nothing else. Each of those
# scripts sources build/toolchain-env.sh and so establishes its own toolchain
# PATH, because a GitHub Actions `run:` step is a fresh shell and a PATH
# exported by one step does not survive into the next. Anything a step needs
# from an earlier step is either written into $GITHUB_PATH / this job's `env:`,
# or - better - re-derived by the script itself.

name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: rebuild and assert the SHA-256
    runs-on: ubuntu-latest
    # Debian bullseye, the same base as build/Dockerfile, so that CI and the
    # local build image are the same host environment down to the package
    # versions (build/setup-toolchain.sh pins them to a Debian snapshot).
    container: debian:bullseye
    timeout-minutes: 300

    env:
      # Pinned host packages; see build/setup-toolchain.sh.
      APT_SNAPSHOT: 20260801T000000Z
      # OpenIPC/linux commit whose message is the Fullhan BSP patch's filename.
      VENDOR_COMMIT: 6bde37dba95d28db55a9962df97b5887ab1dbeaa
      # Fetch and configure the kernel in one place: in CI the tree is a
      # throwaway, so prepare-vendor-kernel.sh configures it in situ instead of
      # copying 700 MB to keep a pristine original.
      VENDOR_SRC: /build/linux-vendor
      KSRC: /build/linux-vendor
      # verify.sh: run the build here rather than via `docker exec`.
      EXEC: direct
      EXPECT_SHA256: a7fcfe277c77d9e497104fd5cc12f62ccd3df851b0ff3292b035444f5d78bb13

    steps:
      # actions/checkout needs git inside the container; without it it falls
      # back to a source tarball with no .git, and `git archive HEAD` - which
      # is what makes this a test of the committed tree rather than of the
      # workspace - would have nothing to export.
      #
      # The sources.list lines here duplicate build/setup-toolchain.sh, which
      # cannot be used yet because it is in the repository we are about to
      # check out. That script is the authority; keep the two in step. The
      # retry loop is there for the same reason it is there: bullseye is EOL
      # and snapshot.debian.org is occasionally slow to answer.
      - name: Bootstrap git for checkout
        run: |
          set -e
          codename=$(. /etc/os-release; echo "$VERSION_CODENAME")
          cat > /etc/apt/sources.list <<SRCLIST
          deb http://snapshot.debian.org/archive/debian/$APT_SNAPSHOT $codename main
          deb http://snapshot.debian.org/archive/debian/$APT_SNAPSHOT $codename-updates main
          deb http://snapshot.debian.org/archive/debian-security/$APT_SNAPSHOT $codename-security main
          SRCLIST
          rm -f /etc/apt/sources.list.d/*.list 2>/dev/null || true
          printf 'Acquire::Check-Valid-Until "false";\nAcquire::Retries "5";\n' \
            > /etc/apt/apt.conf.d/99no-check-valid
          n=0
          until apt-get -o Acquire::Check-Valid-Until=false update \
             && apt-get install -y --no-install-recommends \
                    git ca-certificates curl xz-utils
          do
            n=$((n + 1))
            [ "$n" -lt 3 ] || { echo "!! apt failed $n times" >&2; exit 1; }
            echo "== apt failed, retry $n/3 in 20s" >&2
            sleep 20
          done

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------
      # Toolchain.
      #
      # Each cache is keyed on every file that decides its contents, which now
      # includes build/toolchain-env.sh: that file names the install prefixes
      # and picks which compiler configures the kernel, so editing it has to
      # invalidate the things built with it.
      #
      # These are restore/save pairs rather than plain actions/cache because
      # actions/cache only saves when the whole job succeeds (its post step is
      # `post-if: success()`), and this job's last step is an assertion that is
      # allowed to fail. A failing assertion would otherwise throw away the ~10
      # minutes of toolchain and kernel work that produced it, and the next run
      # would start cold again. Each save is guarded on the step that actually
      # produced the directory having succeeded, so a half-built prefix is
      # never cached.
      # ------------------------------------------------------------------
      - name: Restore crosstool prebuilt (binutils 2.32 + control compiler)
        id: crosstool
        uses: actions/cache/restore@v4
        with:
          path: /opt/gcc-6.5.0-nolibc
          key: >-
            crosstool-6.5.0-${{ runner.arch }}-${{
            hashFiles('build/setup-toolchain.sh', 'build/toolchain-env.sh') }}

      # Runs on every run, cache hit or not: the container is fresh each time,
      # so the apt prerequisites have to be installed even when /opt is warm.
      - name: Prerequisites and crosstool
        id: prereqs
        run: sh build/setup-toolchain.sh

      # Belt and braces. build/*.sh each put their own toolchain on PATH, which
      # is what makes them work in a fresh shell and is the mechanism this job
      # relies on; this makes the crosstool visible to ad-hoc `run:` commands
      # too, and it reads the location from the same file the scripts do rather
      # than repeating it. The vendor-pkgversion GCC is deliberately NOT added:
      # only the module build may use that one, and it selects it itself.
      - name: Put the crosstool on PATH for later steps
        run: |
          . build/toolchain-env.sh
          echo "$CROSSTOOL_BIN" >> "$GITHUB_PATH"

      - name: Restore GCC 6.5.0 built with the vendor --with-pkgversion
        id: gcc-vendor
        uses: actions/cache/restore@v4
        with:
          path: /opt/gcc-6.5.0-vendor
          key: >-
            gcc-vendor-6.5.0-${{ runner.arch }}-${{
            hashFiles('build/build-gcc-vendor.sh', 'build/toolchain-env.sh') }}

      # The expensive step, 9 min cold on a 4-core x86_64 runner. It is what
      # puts "GCC: (arm_multilib_uclibc_20200924) 6.5.0" in .comment, 159 times.
      - name: Build GCC 6.5.0 with the vendor pkgversion
        id: build-gcc
        if: steps.gcc-vendor.outputs.cache-hit != 'true'
        run: sh build/build-gcc-vendor.sh

      - name: Save the vendor GCC
        if: always() && steps.gcc-vendor.outputs.cache-hit != 'true' && steps.build-gcc.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /opt/gcc-6.5.0-vendor
          key: ${{ steps.gcc-vendor.outputs.cache-primary-key }}

      - name: Save the crosstool prebuilt
        if: always() && steps.crosstool.outputs.cache-hit != 'true' && steps.prereqs.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /opt/gcc-6.5.0-nolibc
          key: ${{ steps.crosstool.outputs.cache-primary-key }}

      # ------------------------------------------------------------------
      # Vendor kernel: fetch one commit, retarget CPU_V6 -> CPU_V7, configure
      # with fh8856v200_defconfig, modules_prepare.
      # ------------------------------------------------------------------
      - name: Restore prepared vendor kernel
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: /build/linux-vendor
          key: >-
            vendor-kernel-${{ env.VENDOR_COMMIT }}-${{ runner.arch }}-${{
            hashFiles('build/fetch-vendor-kernel.sh', 'build/prepare-vendor-kernel.sh', 'build/toolchain-env.sh') }}

      - name: Fetch the vendor kernel
        id: fetch-kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: sh build/fetch-vendor-kernel.sh

      - name: Configure the vendor kernel
        id: prepare-kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: sh build/prepare-vendor-kernel.sh

      - name: Save the prepared vendor kernel
        if: always() && steps.kernel.outputs.cache-hit != 'true' && steps.prepare-kernel.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /build/linux-vendor
          key: ${{ steps.kernel.outputs.cache-primary-key }}

      # ------------------------------------------------------------------
      # The assertion.
      # ------------------------------------------------------------------
      # Paths come from build/toolchain-env.sh and from this job's `env:`, so
      # this step reports the toolchain the build will actually use rather than
      # a second copy of the same string.
      - name: Record the environment
        run: |
          . build/toolchain-env.sh
          echo "host          $(uname -m)  $(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "host gcc      $(gcc --version | head -1)"
          echo "on PATH       $(command -v "$TOOLCHAIN_TARGET-gcc")"
          echo "kernel cc     $("$CROSSTOOL_BIN/$TOOLCHAIN_TARGET-gcc" --version | head -1)"
          echo "module cc     $("$VENDOR_GCC_BIN/$TOOLCHAIN_TARGET-gcc" --version | head -1)"
          echo "binutils      $("$VENDOR_GCC_BIN/$TOOLCHAIN_TARGET-as" --version | head -1)"
          echo "kernel        $(cat "$KSRC/include/generated/utsrelease.h")"

      # verify.sh exports HEAD with `git archive`, builds it twice, requires the
      # two builds to be identical, and asserts $EXPECT_SHA256. It is the same
      # script used locally; only EXEC=direct differs, which makes it run the
      # build here instead of through `docker exec`.
      - name: Rebuild twice and assert the SHA-256
        run: sh build/verify.sh

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Reproduction"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| host | \`$(uname -m)\` |"
            echo "| expected SHA-256 | \`$EXPECT_SHA256\` |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
